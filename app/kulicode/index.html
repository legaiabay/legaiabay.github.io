<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>KuliCode: the boring code editor with one command bar</title>
  <meta name="description" content="KuliCode is a plain, native macOS code editor for people who still write their own code. One command bar opens files, searches, replaces and jumps to definitions.">
  <meta name="theme-color" content="#F3EBDD">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/fox-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero" id="top">
    <div class="hero-top">
      <img class="fox" src="assets/fox-256.png" width="88" height="88" alt="KuliCode fox mascot wearing a hard hat">
      <span>v0.2.8</span>
      <h1>KuliCode</h1>
      <p class="sub">Boring lightweight code editor with Command Bar. Native for macOS.</p>
      <div class="cta">
        <a class="btn" href="build/KuliCode-0.2.8.dmg" data-download>Download for macOS (5MB)</a>
        <span class="meta">Apple Silicon · macOS 13 or later</span>
      </div>
    </div>
  </header>

  <section class="features" id="features">
    <div class="win app-win" id="appWin" data-theme="default" data-syntax="default" data-minimap="on" aria-label="Interactive demo of the KuliCode command bar commands">
      <div class="win-bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="win-title" id="winTitle">chain.json — kulicode</span>
      </div>
      <div class="win-body">
        <aside class="side">
          <div class="side-head"><span class="chev">▾</span> kulicode</div>
          <ul class="tree" id="tree"></ul>
        </aside>
        <div class="main">
          <div class="tabs" id="tabs"></div>
          <div class="editor-wrap">
            <div class="scroller" id="scroller">
              <div class="content">
                <div class="gutter" id="gutter"></div>
                <div class="code" id="code">
                  <div class="lines" id="lines"></div>
                </div>
              </div>
            </div>
            <div class="mm" id="mm"><div class="mm-body" id="mmBody"></div><div class="mm-slider" id="mmSlider"></div></div>
            <div class="cb-host cb-host-app" id="appCb"></div>
            <div class="toast" id="toast" aria-hidden="true"></div>
          </div>
          <div class="status">
            <span id="stPos">Ln 1, Col 1</span>
            <span class="st-hint">Click a file to run its command. Click again to replay.</span>
            <span id="stLang">JSON</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="foot">legaiabay @ 2026 - made with ❤️</footer>

  <script src="script.js"></script>
</body>
</html>
