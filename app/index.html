<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080e1d" />
  <title>Apps I've Built — Abay Journal</title>
  <style>
    :root { color-scheme: dark; --ink: #f7f8ff; --muted: #aab2ca; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; overflow-x: hidden; background: #080e1d; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body::before, body::after { content: ""; position: fixed; z-index: -2; pointer-events: none; border-radius: 50%; filter: blur(76px); }
    body::before { width: 42rem; height: 28rem; top: -15rem; left: 50%; transform: translateX(-50%); background: rgba(76, 139, 255, .36); }
    body::after  { width: 42rem; height: 25rem; bottom: -18rem; left: 50%; transform: translateX(-50%); background: rgba(89, 29, 201, .30); }

    /* ── layout ─────────────────────────────────────── */
    .shell { position: relative; width: min(1240px, 100%); min-height: 100vh; margin: auto; padding: 38px 28px 28px; display: flex; flex-direction: column; }
    .brand { display: inline-flex; align-self: center; align-items: center; gap: 8px; color: #ff826e; font-size: 18px; font-weight: 800; letter-spacing: .04em; text-decoration: none; }
    .brand-mark { width: 25px; height: 22px; display: inline-grid; place-items: center; border-radius: 50% 50% 48% 48%; background: #ff755f; color: #151d34; font-size: 15px; }
    header { text-align: center; margin: 28px auto 10px; max-width: 650px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 5vw, 4.5rem); letter-spacing: -.055em; line-height: .98; }
    h1 em { color: #ff8b78; font-style: normal; }
    .lede { max-width: 500px; margin: 14px auto 0; color: var(--muted); font-size: clamp(.88rem, 1.5vw, 1.05rem); line-height: 1.65; }

    /* ── app selector ────────────────────────────────── */
    .app-selector { width: min(1040px, 100%); display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 22px auto 0; padding: 4px 0 10px; }
    .app-selector button { flex: 0 0 auto; padding: 6px 10px; border: 1px solid transparent; border-radius: 99px; color: #aab5ce; background: rgba(91,110,154,.13); font: inherit; font-size: .69rem; cursor: pointer; transition: color .2s, background .2s, border-color .2s; }
    .app-selector button:hover, .app-selector button:focus-visible { color: #f4f7ff; border-color: rgba(133,196,255,.55); }
    .app-selector button.active { color: #241222; border-color: #ff9d89; background: linear-gradient(90deg,#ff9a87,#ff685f); font-weight: 750; }

    /* ── carousel stage ──────────────────────────────── */
    .carousel-area { position: relative; min-height: 440px; display: grid; place-items: center; perspective: 1400px; isolation: isolate; margin-top: 4px; }
    .floor { position: absolute; z-index: -1; width: min(68vw, 860px); height: 110px; bottom: 6%; border-radius: 50%; background: radial-gradient(ellipse, rgba(91,194,255,.32), rgba(96,43,196,.16) 40%, transparent 70%); filter: blur(12px); transform: perspective(360px) rotateX(64deg); }
    /* The carousel wrapper must NOT have overflow:hidden — that flattens the 3D context */
    .carousel { position: relative; width: min(340px, 78vw); height: 355px; }

    /* ── card ────────────────────────────────────────── */
    /* Cards are position:absolute, NO overflow:hidden on the card itself */
    .card { position: absolute; inset: 0; display: flex; flex-direction: column; border: 1px solid rgba(128,171,255,.42); border-radius: 13px; background: linear-gradient(145deg, rgba(30,44,77,.95), rgba(12,18,37,.96)); box-shadow: 0 15px 35px rgba(0,0,0,.42), 0 0 22px rgba(63,153,255,.08); cursor: pointer; user-select: none; }
    .card.active { border-color: rgba(255,133,115,.95); box-shadow: 0 0 0 1px rgba(255,156,138,.20), 0 14px 35px rgba(0,0,0,.4), 0 0 27px rgba(255,99,112,.45); }
    .card[aria-hidden="true"] { pointer-events: none; }
    /* inner clipping wrapper: safe to clip here, outside the transform */
    .card-inner { position: absolute; inset: 0; border-radius: 13px; overflow: hidden; display: flex; flex-direction: column; padding: 13px 13px 15px; }

    /* ── card preview ────────────────────────────────── */
    .preview { position: relative; z-index: 1; flex: 0 0 144px; overflow: hidden; border: 1px solid rgba(162,198,255,.20); border-radius: 8px; background: linear-gradient(135deg, var(--accent), #0e1832 52%, #263b73); }
    .preview img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

    /* ── card content ────────────────────────────────── */
    .card-content { position: relative; z-index: 2; padding: 13px 2px 0; flex: 1; display: flex; flex-direction: column; }
    .app-label { display: flex; gap: 8px; align-items: center; font-size: 1rem; font-weight: 780; letter-spacing: -.02em; }
    .app-icon { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: white; background: var(--accent); box-shadow: 0 5px 14px color-mix(in srgb, var(--accent), transparent 55%); font-weight: 900; font-size: 14px; }
    .description { margin: 9px 0 12px; color: #c1c9de; font-size: .74rem; line-height: 1.42; flex: 1; }
    .tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { padding: 4px 7px; border-radius: 99px; color: #c4cde2; background: rgba(123,142,183,.16); font-size: .61rem; }
    .open { position: relative; z-index: 3; display: inline-flex; justify-content: center; align-items: center; gap: 10px; align-self: center; min-width: 130px; margin-top: 13px; padding: 9px 15px; border: 0; border-radius: 99px; color: #281221; background: linear-gradient(90deg,#ff9a87,#ff685f); box-shadow: 0 7px 18px rgba(255,93,85,.35); font: inherit; font-size: .76rem; font-weight: 800; text-decoration: none; }
    .open:hover, .open:focus-visible { filter: brightness(1.1); }

    /* ── controls ────────────────────────────────────── */
    .controls { display: flex; flex-direction: column; align-items: center; gap: 13px; margin: 6px 0 16px; }
    .carousel-nav { display: flex; align-items: center; justify-content: center; gap: 18px; }
    .nav { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgba(170,195,255,.28); border-radius: 50%; color: #edf2ff; background: rgba(20,31,57,.65); font-size: 25px; line-height: 1; cursor: pointer; backdrop-filter: blur(8px); }
    .nav:hover, .nav:focus-visible { border-color: #88dfff; background: rgba(35,60,101,.9); }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot { width: 7px; height: 7px; padding: 0; border: none; border-radius: 50%; background: #465471; cursor: pointer; transition: width .2s, background .2s; }
    .dot.active { width: 22px; background: #ff7869; border-radius: 8px; }
    .counter { color: #8f9ab5; font-size: .7rem; letter-spacing: .17em; text-transform: uppercase; }
    footer { display: flex; justify-content: center; gap: 16px; align-items: center; color: #8993ac; font-size: .61rem; letter-spacing: .3em; text-transform: uppercase; }
    footer::before, footer::after { content: ""; width: 25px; height: 1px; background: #71809e; }

    /* ── spinner ─────────────────────────────────────────── */
    .spinner { display: flex; flex-direction: column; align-items: center; gap: 14px; color: #8f9ab5; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; }
    .spinner-ring { width: 42px; height: 42px; border: 3px solid rgba(255,120,105,.15); border-top-color: #ff7869; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* hide mobile list on desktop */
    .mobile-list { display: none; }
    @media (max-width: 600px) {
      .shell { padding-inline: 15px; }
      header { margin-top: 24px; }
      .app-selector { margin-top: 17px; }
      footer { letter-spacing: .2em; }

      /* ── mobile: flat vertical scroll list, hide 3D stage ── */
      .carousel-area { display: none; }
      .controls { display: none; }

      .mobile-list { display: flex; flex-direction: column; gap: 14px; margin: 16px 0; }
      .mobile-card { display: flex; flex-direction: column; border: 1px solid rgba(128,171,255,.38); border-radius: 13px; background: linear-gradient(145deg, rgba(30,44,77,.95), rgba(12,18,37,.96)); overflow: hidden; text-decoration: none; color: inherit; }
      .mobile-card-preview { height: 160px; overflow: hidden; background: linear-gradient(135deg, var(--accent), #0e1832 52%, #263b73); }
      .mobile-card-preview img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
      .mobile-card-body { padding: 13px 14px 15px; display: flex; flex-direction: column; gap: 7px; }
      .mobile-card-title { display: flex; align-items: center; gap: 9px; font-size: .95rem; font-weight: 780; }
      .mobile-card-icon { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: white; background: var(--accent); font-size: 13px; font-weight: 900; }
      .mobile-card-desc { color: #c1c9de; font-size: .76rem; line-height: 1.45; margin: 0; }
      .mobile-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
      .mobile-card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
      .mobile-card-arrow { color: #ff8b78; font-size: 1.1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <a class="brand" href="../" aria-label="Back to Abay Journal"><span class="brand-mark">◢</span> ABAY LABS</a>
    <header>
      <h1>Apps <em>I've</em> Built</h1>
      <p class="lede">A collection of tools, experiments, and products made to solve real problems, make work easier, and explore new ideas.</p>
    </header>

    <div class="app-selector" id="appSelector" aria-label="Choose an app"></div>

    <section class="carousel-area" aria-label="App gallery">
      <div class="floor"></div>
      <div class="carousel" id="carousel">
        <div class="spinner" id="spinner">
          <div class="spinner-ring"></div>
          <span>Loading</span>
        </div>
      </div>
    </section>

    <div class="controls">
      <div class="carousel-nav" aria-label="Carousel navigation">
        <button class="nav previous" type="button" aria-label="Previous app">‹</button>
        <div class="dots" id="dots" aria-label="Carousel position"></div>
        <button class="nav next" type="button" aria-label="Next app">›</button>
      </div>
      <div class="counter" id="counter" aria-live="polite"></div>
    </div>

    <!-- mobile vertical list (shown only on narrow screens via CSS) -->
    <div class="mobile-list" id="mobileList" aria-label="App list"></div>

    <footer>Same ideas. A brighter tomorrow.</footer>

  </main>

  <!-- GSAP for reliable cross-browser 3D tweening -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>

    /* ── DOM refs ───────────────────────────────────────── */
    const carouselEl  = document.querySelector('#carousel');
    const selectorEl  = document.querySelector('#appSelector');
    const dotsEl      = document.querySelector('#dots');
    const counterEl   = document.querySelector('#counter');
    const mobileListEl = document.querySelector('#mobileList');
    let apps          = [];
    let current       = 0;
    let touchStartX   = null;
    const cardEls     = [];   // persistent card nodes

    /* ── helpers ────────────────────────────────────────── */
    function signedOffset(index) {
      let d = index - current;
      const half = apps.length / 2;
      if (d >  half) d -= apps.length;
      if (d < -half) d += apps.length;
      return d;
    }

    function cardParams(offset) {
      const d   = Math.abs(offset);
      const mob = window.matchMedia('(max-width:680px)').matches;
      return {
        x:          offset * (mob ? 64 : 77),   // % of card width
        z:          -d * (mob ? 175 : 150),      // px depth
        rotateY:    -offset * (mob ? 17 : 15),   // deg
        opacity:    Math.max(.18, 1 - d * .19),
        saturate:   Math.max(.20, 1 - d * .18),
        brightness: Math.max(.35, 1 - d * .13),
        zIndex:     20 - d,
        hidden:     d > 2,
      };
    }

    /* ── build card DOM (once per app) ──────────────────── */
    function buildCard(app, index) {
      const el = document.createElement('article');
      el.className = 'card';
      el.style.setProperty('--accent', app.accent);
      el.innerHTML = `
        <div class="card-inner">
          <div class="preview">${app.image ? `<img src="${app.image}" alt="${app.name} preview" loading="lazy">` : ''}</div>
          <div class="card-content">
            <div class="app-label">
              <span class="app-icon">${app.icon}</span>
              <span>${app.name}</span>
            </div>
            <p class="description">${app.desc}</p>
            <div class="tags">${app.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            <a class="open" href="${app.path}">Open app <span>→</span></a>
          </div>
        </div>`;
      el.addEventListener('click', ev => {
        if (!ev.target.closest('a') && index !== current) { current = index; render(); }
      });

      // set initial position instantly (no GSAP tween on first paint)
      const p = cardParams(signedOffset(index));
      gsap.set(el, {
        xPercent: p.x, z: p.z, rotateY: p.rotateY,
        opacity: p.opacity, zIndex: p.zIndex,
        filter: `saturate(${p.saturate}) brightness(${p.brightness})`,
      });

      carouselEl.appendChild(el);
      return el;
    }

    /* ── animate all cards to their new positions ────────── */
    function animateCards() {
      apps.forEach((_, index) => {
        const el  = cardEls[index];
        const off = signedOffset(index);
        const p   = cardParams(off);

        el.classList.toggle('active', off === 0);
        el.setAttribute('aria-hidden', p.hidden ? 'true' : 'false');

        gsap.to(el, {
          duration:  0.65,
          ease:      'power2.inOut',
          xPercent:  p.x,
          z:         p.z,
          rotateY:   p.rotateY,
          opacity:   p.opacity,
          zIndex:    p.zIndex,
          filter:    `saturate(${p.saturate}) brightness(${p.brightness})`,
          overwrite: 'auto',
        });
      });
    }

    /* ── mobile vertical list ───────────────────────────── */
    function buildMobileList() {
      mobileListEl.replaceChildren();
      apps.forEach((app, index) => {
        const a = document.createElement('a');
        a.className = 'mobile-card';
        a.href = app.path;
        a.id = `mobile-card-${index}`;
        a.style.setProperty('--accent', app.accent);
        a.innerHTML = `
          <div class="mobile-card-preview">
            ${app.image ? `<img src="${app.image}" alt="${app.name} preview" loading="lazy">` : ''}
          </div>
          <div class="mobile-card-body">
            <div class="mobile-card-title">
              <span class="mobile-card-icon">${app.icon}</span>
              <span>${app.name}</span>
            </div>
            <p class="mobile-card-desc">${app.desc}</p>
            <div class="mobile-card-footer">
              <div class="mobile-card-tags">${app.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
              <span class="mobile-card-arrow">→</span>
            </div>
          </div>`;
        mobileListEl.appendChild(a);
      });
    }

    /* ── rebuild selector + dots, then animate cards ────── */
    function render() {
      selectorEl.replaceChildren();
      dotsEl.replaceChildren();

      apps.forEach((app, index) => {
        // build card once
        if (!cardEls[index]) cardEls[index] = buildCard(app, index);

        // selector pill
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = app.name;
        if (index === current) btn.classList.add('active');
        btn.setAttribute('aria-pressed', index === current ? 'true' : 'false');
        btn.addEventListener('click', () => {
          if (window.matchMedia('(max-width:600px)').matches) {
            const target = document.getElementById(`mobile-card-${index}`);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            current = index; render();
          }
        });
        selectorEl.appendChild(btn);

        // dot
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = `dot${index === current ? ' active' : ''}`;
        dot.ariaLabel = `Show ${app.name}`;
        dot.setAttribute('aria-current', index === current ? 'true' : 'false');
        dot.addEventListener('click', () => { current = index; render(); });
        dotsEl.appendChild(dot);
      });

      counterEl.textContent =
        `${String(current + 1).padStart(2,'0')} / ${String(apps.length).padStart(2,'0')} — ${apps[current].name}`;

      animateCards();
      buildMobileList();
    }

    /* ── navigation ─────────────────────────────────────── */
    function move(dir) { current = (current + dir + apps.length) % apps.length; render(); }

    document.querySelector('.previous').addEventListener('click', () => move(-1));
    document.querySelector('.next').addEventListener('click',     () => move(1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  move(-1);
      if (e.key === 'ArrowRight') move(1);
    });
    carouselEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    carouselEl.addEventListener('touchend', e => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(dx) > 35) move(dx < 0 ? 1 : -1);
      touchStartX = null;
    }, { passive: true });

    /* ── init ───────────────────────────────────────────── */
    fetch('apps.json')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        document.getElementById('spinner').remove();
        apps.push(...data);
        render();
      })
      .catch(err => {
        document.getElementById('spinner').remove();
        counterEl.textContent = 'Failed to load apps.';
        console.error('Could not load apps.json:', err);
      });
  </script>
</body>
</html>
